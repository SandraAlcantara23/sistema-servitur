# docker-compose.yml
# Colócalo en la carpeta raíz (la que contiene servitur-frontend/ y servitur-backend/).
# El Dockerfile.backend que te compartí debe ir dentro de servitur-backend/.

services:
  db:
    image: postgres:16-alpine
    container_name: servitur-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servitur
      POSTGRES_USER: servitur
      POSTGRES_PASSWORD: servitur
    volumes:
      - servitur_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./servitur-backend
      dockerfile: Dockerfile.backend
    container_name: servitur-backend
    restart: unless-stopped
    env_file:
      - ./servitur-backend/.env
    environment:
      - DB_HOST=db
    volumes:
      - ./servitur-backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./servitur-frontend
    container_name: servitur-frontend
    restart: unless-stopped
    volumes:
      - ./servitur-frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  servitur_pgdata: